<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='watch_style.css') }}">
  </head>
  <body>
    <h1>Filtered Video Player</h1>
    <div class="player-container">
      <video controls preload="metadata">
        <source src="{{ url_for('serve_video', video_id=video_id) }}" type="video/mp4"> Your browser does not support HTML5 video.
      </video>
    </div>
    <a href="{{ url_for('index') }}" class="back-btn"> &larr; Back to Search </a>
  </body>
</html>
