<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ContentGuard Safety Platform</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <h1>ContentGuard Safety Platform</h1>

  <form id="search-form" onsubmit="startSearch(event)">
    <input type="text" id="search-query" name="search_query" value="{{ query|default('') }}" placeholder="Search YouTube videos..." required>
    <button type="submit">Search</button>
  </form>

  <div id="loading-indicator">
    <div class="spinner"></div>
    <span id="loading-text">Making sure results are safe...</span>
  </div>

  <div id="results-container" class="results-grid"></div>

  <!-- External JavaScript File -->
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
